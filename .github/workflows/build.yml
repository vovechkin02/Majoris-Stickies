name: Debian 13 build and tests

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git build-essential meson ninja-build valac python3 \
            debhelper dpkg-dev pkgconf xvfb xauth dbus-x11 \
            libglib2.0-dev libgee-0.8-dev libgtk-4-dev libadwaita-1-dev \
            libsqlite3-dev libgtksourceview-5-dev libspelling-1-dev \
            hunspell-en-us nodejs poppler-utils python3-pypdf python3-pil \
            python3-cairosvg desktop-file-utils
      - name: Check out source
        uses: actions/checkout@v4
      - name: Release metadata and native prerequisite preflight
        run: |
          python3 tools/release_preflight.py --require-native
          desktop-file-validate data/com.majoris.stickies.desktop
      - name: Configure
        run: meson setup build -Dwarning_level=3 -Dimagekit=disabled -Dspellcheck=enabled
      - name: Compile
        run: meson compile -C build
      - name: Build without optional spell checking
        run: |
          meson setup build-minimal -Dwarning_level=3 -Dimagekit=disabled -Dspellcheck=disabled
          meson compile -C build-minimal
      - name: Run tests
        run: meson test -C build --print-errorlogs
      - name: Check ImageKit-enabled variant when its SDK is installed
        run: |
          if pkg-config --exists majoris-image-gtk4-1; then
            meson setup build-imagekit -Dwarning_level=3 -Dimagekit=enabled -Dspellcheck=enabled
            meson compile -C build-imagekit
            meson test -C build-imagekit --print-errorlogs
          else
            echo 'ImageKit SDK absent: enabled build remains unqualified on this runner'
          fi
      - name: Static documentation coverage
        run: python3 tools/check_source_docs.py
      - name: Backup and recovery tests
        run: python3 -m unittest discover -s tests/recovery -p 'test_*.py'
      - name: Native build and install staging
        run: meson install -C build --destdir "$PWD/stage"
      - name: GTK startup and single-instance activation under Xvfb
        run: xvfb-run -a dbus-run-session -- python3 tools/smoke_gui.py build/src/majoris-stickies
      - name: Debian binary packages
        run: dpkg-buildpackage -b -us -uc
      - name: Verify installed icon and desktop entry in built package
        run: |
          package=$(find .. -maxdepth 1 -type f -name 'majoris-stickies_*_*.deb' -print -quit)
          test -n "$package"
          dpkg-deb --contents "$package" | grep -F '/usr/share/icons/hicolor/scalable/apps/com.majoris.stickies.svg'
          dpkg-deb --contents "$package" | grep -F '/usr/share/applications/com.majoris.stickies.desktop'
      - name: Shell JavaScript validation
        run: |
          node --check shell/majoris-stickies@majoris.org/extension.js
          node --experimental-default-type=module tests/integration/test_layout.mjs
          python3 -m unittest discover -s tests/integration -p 'test_stage7_*.py'
          python3 -m unittest discover -s tests/integration -p 'test_stage8_*.py'
          python3 -m unittest discover -s tests/integration -p 'test_stage9_*.py'

      - name: Notes-store session concurrency regression
        run: python3 -m unittest discover -s tests/integration -p 'test_store_session_lock.py'
      - name: Raster markup security and format qualification
        run: python3 -m unittest discover -s tests/integration -p 'test_stage9_7_image_markup.py' 

      - name: PDF Ink and non-destructive image crop regression
        run: |
          python3 -m unittest discover -s tests/integration -p 'test_stage9_8_*.py'

      - name: Rotation-aware PDF Ink and visual crop geometry regression
        run: python3 -m unittest discover -s tests/integration -p 'test_stage9_9_*.py'
